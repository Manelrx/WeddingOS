<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e8306e",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211116",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bg-mesh {
            background-color: #f8f6f6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(232, 48, 110, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(232, 48, 110, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 0%, rgba(232, 48, 110, 0.05) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display antialiased bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col bg-mesh overflow-hidden items-center justify-center p-6">
<!-- Top Status Bar Simulation -->
<div class="absolute top-0 left-0 w-full flex justify-between items-center px-8 py-4 opacity-60">
<span class="text-sm font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-sm">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-sm">wifi</span>
<span class="material-symbols-outlined text-sm">battery_full</span>
</div>
</div>
<!-- Glassmorphism Card -->
<div class="glass-effect w-full max-w-[400px] rounded-3xl p-8 shadow-2xl shadow-primary/5">
<div class="flex flex-col items-center mb-8">
<div class="bg-primary/10 p-4 rounded-2xl mb-4">
<span class="material-symbols-outlined text-primary text-4xl leading-none">favorite</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">WeddingOS</h1>
<p class="text-slate-500 text-center text-sm">Acesse sua conta para planejar o seu grande dia</p>
</div>
<form class="space-y-5">
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-600 uppercase tracking-wider ml-1">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-12 pr-4 py-4 rounded-2xl border-none bg-white/50 focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all text-slate-900 placeholder:text-slate-400" placeholder="seu@email.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-600 uppercase tracking-wider ml-1">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-12 pr-12 py-4 rounded-2xl border-none bg-white/50 focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all text-slate-900 placeholder:text-slate-400" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="text-xs font-semibold text-primary hover:opacity-80 transition-opacity" href="#">Esqueci minha senha</a>
</div>
<button class="w-full bg-primary text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-primary/30 hover:shadow-xl hover:brightness-110 active:scale-[0.98] transition-all mt-4" type="submit">
                    Entrar
                </button>
</form>
<div class="mt-8 flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-slate-200"></div>
<span class="text-xs font-medium text-slate-400 uppercase tracking-widest">ou entrar com</span>
<div class="h-[1px] flex-1 bg-slate-200"></div>
</div>
<div class="flex gap-4 mt-6">
<button class="flex-1 flex justify-center items-center py-3 rounded-xl bg-white/50 hover:bg-white border border-slate-100 transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex-1 flex justify-center items-center py-3 rounded-xl bg-white/50 hover:bg-white border border-slate-100 transition-all">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96 0-2.04-.6-3.23-.6-1.16 0-2.12.57-3.11.57-1.93 0-4.96-3.13-4.96-6.32 0-3.22 2.05-4.93 3.96-4.93.98 0 1.77.62 2.57.62.77 0 1.63-.67 2.76-.67 1.14 0 3.39.4 4.54 2.09-.09.05-2.13 1.25-2.13 3.75 0 3.03 2.62 4.09 2.65 4.1-.03.1-.41 1.39-1.34 2.77-.82 1.2-1.67 2.4-3.02 2.4zM12.03 7.25c-.02-2.23 1.83-4.08 4.06-4.08.03 2.22-1.83 4.14-4.06 4.08z"></path>
</svg>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-10 text-center">
<p class="text-slate-500 text-sm">
                Não tem conta? 
                <a class="text-primary font-bold hover:underline transition-all" href="#">Cadastre-se</a>
</p>
</div>
<!-- Bottom Navigation Bar (iOS Style) -->
<div class="fixed bottom-0 left-0 w-full glass-effect border-t border-slate-200/50 px-6 pb-8 pt-4 flex justify-between items-center z-50 rounded-t-3xl shadow-lg">
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined text-2xl">home</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Início</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined text-2xl">calendar_month</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Agenda</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined text-2xl fill-current">person</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Perfil</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined text-2xl">favorite</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Desejos</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined text-2xl">settings</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Ajustes</span>
</a>
</div>
</div>
</body></html>
