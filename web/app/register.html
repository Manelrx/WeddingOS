<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WeddingOS - Criar Conta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e8306e",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211116",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center font-display">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-72 h-72 bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
</div>
<!-- Main Container -->
<div class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col overflow-x-hidden p-6 md:justify-center">
<!-- Header -->
<div class="flex items-center mb-8">
<button class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<!-- Glassmorphism Card -->
<div class="glass-card rounded-xl p-8 shadow-2xl shadow-primary/5">
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-full mb-4">
<span class="material-symbols-outlined text-primary text-3xl">favorite</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold tracking-tight">WeddingOS</h1>
<p class="text-slate-600 dark:text-slate-400 mt-2">Comece a planejar o seu grande dia</p>
</div>
<!-- Form -->
<form class="space-y-5">
<div class="space-y-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Nome</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
<input class="w-full pl-12 pr-4 h-14 bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="Seu nome completo" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-12 pr-4 h-14 bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="exemplo@email.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-12 pr-12 h-14 bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="Mínimo 8 caracteres" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<button class="w-full h-14 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                    Criar Conta
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                    Já tem uma conta? 
                    <a class="text-primary font-bold hover:underline underline-offset-4 decoration-2" href="#">Entre aqui</a>
</p>
</div>
</div>
<!-- Social Footer (Optional context addition for "Premium" feel) -->
<div class="mt-8 px-4">
<div class="flex items-center gap-4 mb-6">
<div class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></div>
<span class="text-slate-400 text-xs font-medium uppercase tracking-widest">ou continue com</span>
<div class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></div>
</div>
<div class="flex gap-4">
<button class="flex-1 h-12 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white">google</span>
</button>
<button class="flex-1 h-12 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white">ios</span>
</button>
</div>
</div>
<div class="mt-auto py-6 text-center">
<p class="text-[10px] text-slate-400 dark:text-slate-500 px-8">
                Ao criar uma conta, você concorda com nossos <a class="underline" href="#">Termos de Serviço</a> e <a class="underline" href="#">Política de Privacidade</a>.
            </p>
</div>
</div>
</body></html>
